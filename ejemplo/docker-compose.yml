services:
  postgres:
    image: postgres:16.4
    container_name: alembic-postgres
    environment:
      POSTGRES_USER: alembic
      POSTGRES_PASSWORD: alembic
      POSTGRES_DB: tienda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alembic -d tienda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
